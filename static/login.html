<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso del personal · Oplesktaurant</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="login-page">
  <section class="login-story" aria-label="Oplesktaurant">
    <a class="brand" href="/"><img class="brand-mark" src="/static/img/emblem.svg" alt="" aria-hidden="true"> Oplesktaurant</a>
    <h2>Detrás de cada mesa,<br><span>una operación conectada.</span></h2>
    <p>Tu espacio para coordinar tareas, consultar inventario y gestionar sucursales.</p>
  </section>
  <main class="login-card">
    <span class="eyebrow">Workspace / Acceso privado</span>
    <h1>Acceso del personal</h1>
    <p class="sub">Entra con tu cuenta de personal. No hay auto-registro público.</p>
    <form id="login-form" novalidate>
      <label>
        Email
        <input type="email" id="login-email" name="email" autocomplete="username" required maxlength="255">
      </label>
      <label>
        Contraseña
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>
      </label>
      <p class="login-error" id="login-error" role="alert"></p>
      <button type="submit" id="login-submit">Entrar</button>
    </form>
    <a class="login-back" href="/">← Volver a la landing</a>
  </main>
  <script src="/static/js/auth.js"></script>
</body>
</html>
